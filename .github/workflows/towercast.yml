name: TowerCast Sync

on:
  # Run daily at 10:00 UTC (6:00 AM EDT / 7:00 AM EST)
  schedule:
    - cron: '0 10 * * *'

  # Manual dispatch or mobile GitHub Pages trigger
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (sync, queue, add_favorite, delete_favorite)'
        required: false
        default: 'sync'
      video_id:
        description: 'YouTube Video ID to download (if action=queue)'
        required: false
      keyword:
        description: 'Keyword for favorite rule'
        required: false
      scan_limit:
        description: 'Number of recent channel videos to scan'
        required: false
        default: '30'

  # Mobile triggers via GitHub Issues (works 100% when Mac is off)
  issues:
    types: [opened]

jobs:
  sync:
    name: Sync & Deploy Feed
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create releases and push gh-pages
      pages: write      # needed for GitHub Pages deployment
      issues: write     # needed to comment on and close triggers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install yt-dlp bottle

      - name: Verify yt-dlp
        run: yt-dlp --version

      - name: Run TowerCast feed builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCAN_LIMIT: ${{ github.event.inputs.scan_limit || '30' }}
          ACTION: ${{ github.event.inputs.action || 'sync' }}
          VIDEO_ID: ${{ github.event.inputs.video_id || '' }}
          KEYWORD: ${{ github.event.inputs.keyword || '' }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python3 github/feed_builder.py

      - name: Deploy feed.xml & Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-output
          keep_files: false
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'TowerCast sync: ${{ github.run_id }}'
