name: TowerCast Sync

on:
  # Run daily at 10:00 UTC (6:00 AM EDT / 7:00 AM EST)
  schedule:
    - cron: '0 10 * * *'

  # Allow manual runs from the Actions tab with an optional limit override
  workflow_dispatch:
    inputs:
      scan_limit:
        description: 'Number of recent channel videos to scan'
        required: false
        default: '30'

jobs:
  sync:
    name: Sync & Deploy Feed
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create releases and push gh-pages
      pages: write      # needed for GitHub Pages deployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install yt-dlp

      - name: Verify yt-dlp
        run: yt-dlp --version

      - name: Run TowerCast feed builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCAN_LIMIT: ${{ github.event.inputs.scan_limit || '30' }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python3 github/feed_builder.py

      - name: Deploy feed.xml to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-output
          # Keep existing assets between deployments (don't wipe old pages)
          keep_files: false
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'TowerCast sync: ${{ github.run_id }}'
